# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    continue-on-error: ${{ matrix.config.allow-failure || false }}

    strategy:
      fail-fast: false
      matrix:
        config:
          # CRAN checks four macOS flavours and two of them are x86_64, so the
          # matrix covers both architectures rather than only the current one.
          #
          # The Intel entry is expected to fail while the DuckDB community
          # extension repository serves an arm64 build of `h3` under the
          # osx_amd64 path (broken since extension v1.5.5). That is an upstream
          # packaging bug, not a package regression, and the entry is kept so
          # the breakage stays visible. See issue #99. Do not swap this runner
          # for macos-latest: that would hide the only architecture where the
          # bug appears.
          - {os: macos-15-intel, r: 'release', allow-failure: true}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache-version: ${{ runner.os }}-${{ runner.arch }}-v3

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
